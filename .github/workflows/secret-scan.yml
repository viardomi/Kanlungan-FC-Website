name: Secret scan
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    name: Secret scan (redacted)
    runs-on: ubuntu-24.04
    steps:
      - name: Verify isolated Linux workspace and temp paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import sys

          if sys.platform != "linux":
              raise SystemExit("BLOCKED_UNKNOWN_PATH")

          runner_root = pathlib.Path("/home/runner/work").resolve(strict=True)
          raw_targets = {
              "GITHUB_WORKSPACE": os.environ.get("GITHUB_WORKSPACE", ""),
              "RUNNER_TEMP": os.environ.get("RUNNER_TEMP", ""),
          }
          targets = []
          for name, raw in raw_targets.items():
              if not raw:
                  raise SystemExit("BLOCKED_UNKNOWN_PATH")
              candidate = pathlib.Path(raw)
              if not candidate.is_absolute():
                  raise SystemExit("BLOCKED_UNKNOWN_PATH")
              normalized = pathlib.Path(os.path.normpath(str(candidate)))
              if candidate.resolve(strict=False) != normalized:
                  raise SystemExit("BLOCKED_UNKNOWN_PATH")
              if not normalized.is_relative_to(runner_root):
                  raise SystemExit("BLOCKED_UNKNOWN_PATH")
              current = pathlib.Path(normalized.anchor)
              for part in normalized.parts[1:]:
                  current = current / part
                  if current.is_symlink():
                      raise SystemExit("BLOCKED_UNKNOWN_PATH")
              if any("onedrive" in part.lower() for part in normalized.parts):
                  raise SystemExit("BLOCKED_ONEDRIVE_RISK")
              targets.append(normalized)

          known_roots = {"onedrive", "onedriveconsumer", "onedrivecommercial"}
          for name, raw in os.environ.items():
              if name.lower() in known_roots:
                  if not raw:
                      raise SystemExit("BLOCKED_UNKNOWN_PATH")
                  root = pathlib.Path(raw)
                  if not root.is_absolute():
                      raise SystemExit("BLOCKED_UNKNOWN_PATH")
                  resolved_root = root.resolve(strict=True)
                  if any(t == resolved_root or t in resolved_root.parents or resolved_root in t.parents for t in targets):
                      raise SystemExit("BLOCKED_ONEDRIVE_RISK")

          local_filesystems = {"overlay", "ext4", "xfs", "btrfs", "tmpfs"}
          def unescape_mount(path):
              return re.sub(r"\\([0-7]{3})", lambda m: chr(int(m.group(1), 8)), path)
          def overlaps(a, b):
              return a == b or a in b.parents or b in a.parents

          with open("/proc/self/mountinfo", encoding="utf-8") as mountinfo:
              for line in mountinfo:
                  fields = line.split()
                  separator = fields.index("-")
                  mountpoint = pathlib.Path(unescape_mount(fields[4])).resolve(strict=False)
                  filesystem = fields[separator + 1]
                  if any(overlaps(target, mountpoint) for target in targets) and filesystem not in local_filesystems:
                      raise SystemExit("BLOCKED_UNKNOWN_PATH")

          print("SAFE_LOCAL runner workspace and temp paths verified.")
          PY
      - name: Check out full history without persisting credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download and verify pinned Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan available refs and history with redacted findings
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" git --log-opts="--all" --redact=100 --no-banner --exit-code 1 .
